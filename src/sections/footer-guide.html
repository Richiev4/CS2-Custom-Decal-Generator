  <footer id="appFooter">
    <div class="bottom-panel-container" id="bottomPanelContainer">
      <!-- Dual View Switcher Header & Action Toolbar -->
      <div class="bottom-panel-header">
        <!-- View Switcher Tabs -->
        <div class="bottom-tab-switcher" role="tablist" aria-label="Bottom View Switcher">
          <button type="button" class="bottom-tab-btn active" id="tabBtnRibbon" role="tab" aria-selected="true" onclick="switchBottomView('ribbon')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            <span>Series Ribbon</span>
            <span class="bottom-tab-badge" id="ribbonSeriesCountBadge">0</span>
          </button>
          <button type="button" class="bottom-tab-btn" id="tabBtnGuide" role="tab" aria-selected="false" onclick="switchBottomView('guide')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Destination Folder Info</span>
          </button>
        </div>

        <!-- Series Context Selector (Shown in Ribbon View) -->
        <div class="bottom-header-context" id="ribbonHeaderControls">
          <div class="series-select-group">
            <span class="series-select-label">Active Series:</span>
            <select id="ribbonSeriesSelect" class="ribbon-series-select" onchange="onRibbonSeriesSelectChange(this.value)">
              <option value="all">All Series</option>
            </select>
          </div>
        </div>

        <!-- Quick Action Buttons -->
        <div class="bottom-header-actions">
          <button type="button" class="bottom-action-btn btn-save-to-series" id="btnSaveToActiveSeries" onclick="saveCurrentToActiveSeries()" title="Save current workspace asset into this series">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span id="saveToSeriesBtnText">+ Add Current to Series</span>
          </button>
          <button type="button" class="bottom-action-btn" onclick="openSavedLibraryModal()" title="View browser-saved decal & surface library">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Library (<span id="ribbonLibraryTotalBadge">0</span>)</span>
          </button>
          <button type="button" class="bottom-action-btn btn-toggle-collapse" id="btnToggleBottomCollapse" onclick="toggleBottomCollapse()" title="Minimize / Expand bottom panel">
            <svg id="bottomCollapseChevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

      <!-- VIEW 1: Series Asset Ribbon Strip -->
      <div class="bottom-panel-content" id="bottomRibbonView">
        <div class="ribbon-carousel-wrapper">
          <button type="button" class="ribbon-scroll-btn left" id="ribbonScrollLeftBtn" onclick="scrollRibbon('left')" title="Scroll left" aria-label="Scroll ribbon left">‹</button>
          
          <div class="ribbon-cards-track" id="ribbonCardsTrack">
            <!-- Dynamically populated series asset cards -->
          </div>

          <button type="button" class="ribbon-scroll-btn right" id="ribbonScrollRightBtn" onclick="scrollRibbon('right')" title="Scroll right" aria-label="Scroll ribbon right">›</button>
        </div>
      </div>

      <!-- VIEW 2: Destination Folder & Mod Installation Guide -->
      <div class="bottom-panel-content" id="bottomGuideView" style="display: none;">
        <div class="guide-box">
          <div class="guide-header">
            <div class="guide-title" id="guideTitle">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span id="folderTitleText">Cities: Skylines 2 Custom Decal Destination Folder</span>
            </div>
            <div class="guide-notes">
              <div class="guide-step"><span class="step-num">1</span> Click 'Export Asset Package'</div>
              <div class="guide-step"><span class="step-num">2</span> Extract folder to directory below</div>
              <div class="guide-step"><span class="step-num">3</span> Open CS2 find asset in tool menu</div>
              <button type="button" class="guide-switch-btn" onclick="switchBottomView('ribbon')">
                <span>View Series Ribbon ➔</span>
              </button>
            </div>
          </div>

          <div class="path-row">
            <span class="path-text" id="targetPathText">%AppData%\..\LocalLow\Colossal Order\Cities Skylines II\ModsData\ExtraAssetsImporter\CustomDecals\</span>
            <button class="copy-btn" onclick="copyDecalPath()">Copy Directory Path</button>
          </div>
        </div>
      </div>
    </div>
  </footer>
