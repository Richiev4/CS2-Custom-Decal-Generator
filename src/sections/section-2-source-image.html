      <div class="collapsible-section collapsed" id="secToolsSource">
        <div class="section-title collapsible-header" onclick="toggleSection('secToolsSource')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('secToolsSource');}" tabindex="0" role="button" aria-expanded="false">
          <div class="section-header-left">
            <svg class="section-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            <div class="form-label-left">
              <span>1. Source Image Input</span>
              <button type="button" class="help-q-btn" onclick="event.stopPropagation(); toggleFieldHelp(this, 'sourceImage', event)" onmouseenter="showFieldHelp(this, 'sourceImage', event)" onmouseleave="scheduleHideFieldHelp()" aria-label="Help for Source Image Input" title="Help for Source Image Input">?</button>
            </div>
          </div>
          <div class="section-header-right">
            <span id="sourceImageStatusBadge" style="font-size: 10px; color: var(--accent-cyan); font-weight: 600;">Aspect Ratio Auto-Synced</span>
          </div>
        </div>
        <div class="collapsible-content">
          <!-- Active Set Slot Indicator & Quick Switcher -->
          <div class="set-slot-target-banner">
            <div class="set-slot-target-left">
              <span class="set-slot-target-icon">🎯</span>
              <div class="set-slot-target-details">
                <span class="set-slot-target-title">Target Slot: <strong id="dropZoneTargetSlotLabel">DECAL</strong></span>
                <span class="set-slot-target-sub" id="dropZoneTargetSlotSub">Uploads will replace Decal graphic only</span>
              </div>
            </div>
            <div class="set-quick-slots-nav" role="tablist" aria-label="Switch target slot">
              <button type="button" class="quick-slot-tab active" id="quickSlotDecal" onclick="setMode('decal')" title="Upload graphic into Decal slot">
                <span class="quick-slot-dot loaded" id="quickDotDecal"></span>
                <span>Decal</span>
              </button>
              <button type="button" class="quick-slot-tab" id="quickSlotSurface" onclick="setMode('surface')" title="Upload graphic into Surface slot">
                <span class="quick-slot-dot loaded" id="quickDotSurface"></span>
                <span>Surface</span>
              </button>
              <button type="button" class="quick-slot-tab" id="quickSlotNetlane" onclick="setMode('netlane')" title="Upload graphic into Net Lane slot">
                <span class="quick-slot-dot loaded" id="quickDotNetlane"></span>
                <span>Net Lane</span>
              </button>
            </div>
          </div>

          <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp" onchange="handleFileSelect(event)">
            <div class="drop-icon">⤓</div>
            <div class="drop-title" id="dropTitleText">Drop PNG or JPG decal texture</div>
            <div class="drop-hint" id="dropHintText">All ratios supported • 2:3 / 3:4 Posters, 16:9 Billboards, or 1:1 Square</div>
          </div>
        </div>
      </div>
